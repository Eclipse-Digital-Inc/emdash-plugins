name: "Publish EmDash plugins"

on:
  push:
    tags:
      - "*@*"
  workflow_dispatch:
    inputs:
      package:
        description: "Plugin ID to publish"
        required: true
        type: string

permissions:
  contents: read
  id-token: write # Required for the audience-bound GitHub OIDC token.
  attestations: write # Required to sign build provenance.

concurrency:
  group: emdash-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: "Build and publish plugin"
    runs-on: ubuntu-latest
    steps:
      - name: "Check repository visibility"
        if: ${{ github.event.repository.visibility != 'public' }}
        run: |
          echo "::error title=Public repository required::EmDash releases currently require a public GitHub repository because private and internal repository attestations cannot yet be verified."
          exit 1

      - name: "Check out repository"
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # Edited from the generated pnpm steps: this repo uses npm with one
      # package-lock.json per plugin. Keep this if regenerating with --force.
      - name: "Set up Node.js"
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: "*/package-lock.json"

      - name: "Install dependencies"
        shell: bash
        run: |
          set -euo pipefail
          # --legacy-peer-deps works around an npm peer-resolution crash on vitest's peer set.
          for manifest in */emdash-plugin.jsonc; do
            (cd "$(dirname "$manifest")" && npm ci --legacy-peer-deps)
          done

      - name: "Prepare plugin release"
        id: prepare
        shell: bash
        env:
          EMDASH_RELEASE_SELECTOR: ${{ inputs.package || github.ref_name }}
        run: |
          set -euo pipefail
          npx --yes @emdash-cms/plugin-cli@0.13.1 release prepare "${EMDASH_RELEASE_SELECTOR}" --dir . --out-dir .emdash-release

      - name: "Create build provenance"
        id: attest
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: ${{ steps.prepare.outputs.bundle-file }}

      - name: "Publish plugin"
        uses: emdash-cms/emdash/apps/release-action@main # zizmor: ignore[unpinned-uses] -- configured by --action-ref
        with:
          service-url: https://releases.emdashcms.com
          publisher-did: ${{ steps.prepare.outputs.publisher-did }}
          bundle-file: ${{ steps.prepare.outputs.bundle-file }}
          provenance-file: ${{ steps.attest.outputs.bundle-path }}
